[project]
name = "customer-support"
version = "0.1.0"
description = "Policy-grounded fashion retailer support-model evaluation POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
]

[project.scripts]
support-poc = "support_poc.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_poc"]
